<!doctype html><meta name="viewport" content="width=device-width">
<style>html,body{margin:0;background:#1a1512}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
// ?glbs=a.glb,b.glb  &w=375 per cell &h=560 &clip=Idle &t=0.5 &view=front|q34 &solo=1 (single body, tight camera)
const q = new URLSearchParams(location.search);
const list = q.get("glbs").split(",");
const W = +(q.get("w") ?? 375), H = +(q.get("h") ?? 560), T = +(q.get("t") ?? 0.5), view = q.get("view") ?? "front";
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setPixelRatio(devicePixelRatio);
r.setSize(W * list.length, H);
r.outputColorSpace = THREE.SRGBColorSpace;
r.toneMapping = THREE.ACESFilmicToneMapping;
r.setScissorTest(true);
document.body.appendChild(r.domElement);
const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
for (let i = 0; i < list.length; i++) {
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x2a2220);
  scene.add(new THREE.HemisphereLight(0xffd9a8, 0x2a2018, 1.3));
  const sun = new THREE.DirectionalLight(0xffc890, 2.2); sun.position.set(-2, 3, 2.5); scene.add(sun);
  const rim = new THREE.DirectionalLight(0x8899aa, 0.8); rim.position.set(2, 1.5, -3); scene.add(rim);
  const g = await loader.loadAsync(list[i]);
  scene.add(g.scene);
  const clip = g.animations.find((a) => a.name === (q.get("clip") ?? "Idle")) ?? g.animations[0];
  const mixer = new THREE.AnimationMixer(g.scene);
  mixer.clipAction(clip).play(); mixer.update(T);
  g.scene.updateMatrixWorld(true);
  const box = new THREE.Box3().setFromObject(g.scene, true), c = box.getCenter(new THREE.Vector3()), s = box.getSize(new THREE.Vector3());
  const cam = new THREE.PerspectiveCamera(30, W / H, 0.1, 50);
  const d = Math.max(s.y / 2 / Math.tan(THREE.MathUtils.degToRad(15)) * 1.15, 2);
  const dir = view === "q34" ? new THREE.Vector3(0.6, 0.15, 0.8).normalize() : new THREE.Vector3(0, 0.05, 1);
  cam.position.copy(c).addScaledVector(dir, d); cam.lookAt(c);
  r.setViewport(i * W, 0, W, H); r.setScissor(i * W, 0, W, H);
  r.render(scene, cam);
  document.title += `${list[i]}:h${s.y.toFixed(2)}/min${box.min.y.toFixed(3)} `;
}
window.__ready = true;
</script>
