<!doctype html>
<meta name="viewport" content="width=device-width">
<style>html,body{margin:0;background:#15110e}canvas{display:block}</style>
<!-- Scratch QA page for the hub NPC stills (not game code). Plays an NPC's Idle through the engine's own DonorMotion (src/donor-motion.js) on the
     game's own camera rig (central-hub layout.json: height, distance, targetZ, fieldOfView, zoom, characterScale), the game's lights and no tone mapping.
     ?ref=npc-marsh &view=front|q34 &close=0|1|2 (1 = about 4.5x zoom, 2 = head and chest) &phases=0,0.25 (one cell per phase, side by side)
     &glb=/cand/x.glb (try a candidate file against the same manifest row). The feet are grounded: the lowest skinned vertex of each pose sits on y = 0. -->
<script type="importmap">{"imports":{"three":"/Web/node_modules/three/build/three.module.js","three/addons/":"/Web/node_modules/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
import { DonorMotion } from "/Web/src/donor-motion.js";
import { GAME_DATA } from "/Web/src/engine/game-data.js";

const q = new URLSearchParams(location.search);
const ref = q.get("ref"), view = q.get("view") ?? "front", level = +(q.get("close") ?? 0);
const phases = (q.get("phases") ?? q.get("phase") ?? "0").split(",").map(Number);
const W = innerWidth / phases.length, H = innerHeight;
const manifest = await (await fetch("/Web/public/assets/manifest-hollow.json")).json();
const layout = await (await fetch("/Web/public/world/central-hub/layout.json")).json();
const row = manifest.models[ref];
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setPixelRatio(devicePixelRatio);
r.setSize(innerWidth, H);
r.outputColorSpace = THREE.SRGBColorSpace;
r.toneMapping = THREE.NoToneMapping;
r.setScissorTest(true);
document.body.appendChild(r.domElement);
const scene = new THREE.Scene();
const bg = await new THREE.TextureLoader().loadAsync("/Web/public/world/central-hub/backdrop-phone.webp");
bg.colorSpace = THREE.SRGBColorSpace;
scene.background = bg;
const lights = GAME_DATA.browserSession.sceneLights;
scene.add(new THREE.HemisphereLight(lights.hemiSky, lights.hemiGround, layout.fillIntensity));
const sun = new THREE.DirectionalLight(lights.sunColor, layout.keyIntensity);
sun.position.set(...lights.sunPosition);
scene.add(sun);
const rim = new THREE.PointLight(lights.rimColor, lights.rimIntensity, lights.rimDistance, lights.rimDecay);
rim.position.set(0, lights.rimHeight, -layout.targetZ + lights.rimBehind);
scene.add(rim);

const gltf = await new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync(q.get("glb") ?? "/Web/public/assets/" + row.url);
const root = new THREE.Group();
root.add(gltf.scene);
const scale = row.scale * layout.characterScale;
root.scale.setScalar(scale);
root.position.set(0, 0, -layout.targetZ);
root.rotation.y = view === "q34" ? 0.7 : 0;
scene.add(root);
const motion = new DonorMotion(root, gltf.scene, gltf.animations, row);

const sanitize = (n) => THREE.PropertyBinding.sanitizeNodeName(n);
const at = (n) => new THREE.Vector3().setFromMatrixPosition(gltf.scene.getObjectByName(sanitize(n)).matrixWorld);
const v = new THREE.Vector3();
const lowest = () => {
  let low = Infinity;
  root.updateMatrixWorld(true);
  gltf.scene.traverse((node) => {
    if (!node.isSkinnedMesh) return;
    node.skeleton.update();
    for (let i = 0; i < node.geometry.attributes.position.count; i++) low = Math.min(low, node.getVertexPosition(i, v).applyMatrix4(node.matrixWorld).y);
  });
  return low;
};
const frames = [];
for (const p of Array.from({ length: 21 }, (_, i) => (i / 20) * 0.99)) {
  motion.sample(row.clips.idle, p);
  frames.push({ phase: p, head: at(row.headBone).y, hips: at("mixamorig:Hips").y, foot: Math.min(at("mixamorig:LeftFoot").y, at("mixamorig:RightFoot").y), headX: at(row.headBone).x, rHand: at("mixamorig:RightHand").toArray(), lHand: at("mixamorig:LeftHand").toArray(), low: lowest() });
}
window.__report = { ref, clip: motion.currentClip, duration: gltf.animations[0].duration, frames };

// Contact shadow: a tight dark pool under the body so the feet read as standing (the painted backdrop has no floor shadow of its own).
const shade = document.createElement("canvas");
shade.width = shade.height = 64;
const sg = shade.getContext("2d"), grad = sg.createRadialGradient(32, 32, 1, 32, 32, 32);
grad.addColorStop(0, "rgba(0,0,0,0.9)");
grad.addColorStop(0.55, "rgba(0,0,0,0.6)");
grad.addColorStop(1, "rgba(0,0,0,0)");
sg.fillStyle = grad;
sg.fillRect(0, 0, 64, 64);
const blob = new THREE.Mesh(new THREE.PlaneGeometry(1.3 * scale, 1.0 * scale), new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(shade), transparent: true, depthWrite: false }));
blob.rotation.x = -Math.PI / 2;
blob.position.set(0, 0.005, -layout.targetZ);
scene.add(blob);

const zoom = layout.zoom * (level === 2 ? 12 : level === 1 ? 4.5 : 1);
const cam = new THREE.PerspectiveCamera((2 * Math.atan(Math.tan(THREE.MathUtils.degToRad(layout.fieldOfView) / 2) / zoom) * 180) / Math.PI, W / H, 0.1, 200);
cam.position.set(0, layout.height, layout.distance);
cam.lookAt(0, level === 2 ? 1.75 : level === 1 ? 0.95 : 0, -layout.targetZ);
cam.updateMatrixWorld(true);
phases.forEach((p, i) => {
  motion.sample(row.clips.idle, p);
  root.position.y = 0;
  root.position.y = -lowest(); // ground the feet on the staged floor
  root.updateMatrixWorld(true);
  r.setViewport(i * W, 0, W, H);
  r.setScissor(i * W, 0, W, H);
  r.render(scene, cam);
});
window.__ready = true;
</script>
