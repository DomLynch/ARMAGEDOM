const loader=new GLTFLoader(),[body,knife,gun,manifest]=await Promise.all([loader.loadAsync('/Web/public/assets/donor/warrior.glb'),loader.loadAsync('/Web/public/assets/donor/knife.glb'),loader.loadAsync('/Web/public/assets/pistol/pistol.glb'),fetch('/Web/public/assets/donor/manifest.json').then(r=>r.json())]),views=[];
for(const kind of ['grip','side','game']){
 const scene=new T.Scene(),renderer=new T.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});renderer.setSize(420,480);renderer.setPixelRatio(1);document.querySelector('#'+kind).append(renderer.domElement);scene.background=new T.Color('#858886');
 const camera=kind==='game'?new T.PerspectiveCamera():new T.OrthographicCamera(-1.05,1.05,1.2,-1.2,.01,40);camera.position.set(kind==='side'?6:2,1.4,kind==='side'?1:5);camera.lookAt(0,1,0);scene.add(new T.HemisphereLight(0xcbd7dc,0x494038,1.6));const light=new T.DirectionalLight(0xffecd5,2.5);light.position.set(-3,5,4);scene.add(light);
 const source=equipDonorPlayer({scene:clone(body.scene),animations:body.animations},knife),root=new T.Group();root.add(source.scene);scene.add(root);root.scale.setScalar(kind==='game'?1.265*1.3225:1);
