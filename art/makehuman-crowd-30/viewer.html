<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>crowd30 viewer</title>
<style>html,body{margin:0;background:#2a2d31}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
<script type="module">
// ?ids=a,b,c&mode=full|torso&cols=3&clip=Idle&t=0.4   one canvas, one scissor cell per body, 375 css px wide (DPR 3 from the driver)
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
const q = new URLSearchParams(location.search);
const ids = q.get("ids").split(","), mode = q.get("mode") || "full", cols = +(q.get("cols") || 3), clipName = q.get("clip") || "Idle", tAt = +(q.get("t") || 0.4);
const W = 375, cellW = W / cols, cellH = mode === "torso" ? cellW * 1.3 : cellW * 2.3, rows = Math.ceil(ids.length / cols);
const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(devicePixelRatio); renderer.setSize(W, cellH * rows); renderer.setScissorTest(true); renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
const loader = new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x3a3f45);
scene.add(new THREE.HemisphereLight(0xffffff, 0x555560, 1.6));
const key = new THREE.DirectionalLight(0xfff2e0, 2.2); key.position.set(1.5, 3, 3); scene.add(key);
const info = [];
for (let i = 0; i < ids.length; i++) {
  const g = await loader.loadAsync(`/crowd/${ids[i]}.glb`);
  const root = g.scene, mixer = new THREE.AnimationMixer(root);
  const clip = g.animations.find((c) => c.name === clipName); mixer.clipAction(clip).play(); mixer.update(tAt);
  root.updateMatrixWorld(true);
  let draws = 0, tris = 0; const box = new THREE.Box3(), v = new THREE.Vector3();
  root.traverse((n) => { if (n.isSkinnedMesh) { n.skeleton.update(); draws++; tris += n.geometry.index.count / 3; for (let k = 0; k < n.geometry.attributes.position.count; k++) { n.getVertexPosition(k, v).applyMatrix4(n.matrixWorld); box.expandByPoint(v); } } });
  info.push({ id: ids[i], draws, tris, top: +box.max.y.toFixed(3), bottom: +box.min.y.toFixed(3), width: +(box.max.x - box.min.x).toFixed(3) });
  scene.add(root);
  const cam = new THREE.PerspectiveCamera(mode === "torso" ? 22 : 24, cellW / cellH, 0.1, 50);
  const h = box.max.y - box.min.y;
  if (mode === "torso") { cam.position.set(0, box.min.y + h * 0.78, 2.1); cam.lookAt(0, box.min.y + h * 0.78, 0); }
  else { cam.position.set(0, box.min.y + h * 0.5, 5.2); cam.lookAt(0, box.min.y + h * 0.5, 0); }
  const col = i % cols, row = Math.floor(i / cols);
  renderer.setViewport(col * cellW, (rows - 1 - row) * cellH, cellW, cellH); renderer.setScissor(col * cellW, (rows - 1 - row) * cellH, cellW, cellH);
  renderer.render(scene, cam);
  scene.remove(root);
}
window.__info = info; window.__done = true;
</script>
