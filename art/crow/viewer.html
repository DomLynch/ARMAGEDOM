<!doctype html><meta name="viewport" content="width=device-width">
<style>html,body{margin:0;background:#1a1512}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
// Model viewer for the crow: ?glb=/crow.glb&view=q34|front|top|side&clip=rat_idle&t=0.4
const q = new URLSearchParams(location.search);
const view = q.get("view") ?? "q34";
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(innerWidth, innerHeight);
r.setPixelRatio(devicePixelRatio);
r.outputColorSpace = THREE.SRGBColorSpace;
r.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a2220);
scene.fog = new THREE.Fog(0x2a2220, 4, 12);
scene.add(new THREE.HemisphereLight(0xffd9a8, 0x2a2018, 1.1));
const sun = new THREE.DirectionalLight(0xffc890, 2.4);
sun.position.set(-2, 3, 2.5);
scene.add(sun);
const rim = new THREE.DirectionalLight(0x8899aa, 0.9);
rim.position.set(2, 1.5, -3);
scene.add(rim);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x1c1816, roughness: 0.35, metalness: 0.1 }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);
const cam = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 50);
const g = await new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync(q.get("glb"));
const model = g.scene;
model.scale.setScalar(3);
scene.add(model);
const mixer = new THREE.AnimationMixer(model);
const clip = g.animations.find((a) => a.name === (q.get("clip") ?? "rat_idle"));
mixer.clipAction(clip).play();
mixer.update(Number(q.get("t") ?? 0.4));
model.updateMatrixWorld(true);
// the bite sweep reads vertex 80 of the fourth primitive
const names = [];
model.traverse((o) => { if (o.isSkinnedMesh) names.push(o.name); });
window.__names = names;
const tooth = model.getObjectByName("Original_ARM_rat_surface_3") ?? model.getObjectByName(names[names.length - 1]);
const p80 = new THREE.Vector3();
tooth.getVertexPosition(80, p80);
window.__tooth = { count: tooth.geometry.attributes.position.count, p80: p80.toArray().map((x) => +x.toFixed(4)) };
const box = new THREE.Box3().setFromObject(model);
const c = box.getCenter(new THREE.Vector3());
const views = { q34: [1.5, 1.2, 1.7], front: [0, 0.9, 2.6], top: [0.01, 3.2, 0.3], side: [2.6, 0.7, 0.2] };
const p = views[view];
cam.position.set(c.x + p[0], c.y + p[1], c.z + p[2]);
cam.lookAt(c);
r.render(scene, cam);
window.__ready = true;
</script>
