<!doctype html><meta name="viewport" content="width=device-width">
<style>html,body{margin:0;background:#1a1512}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(innerWidth, innerHeight);
r.setPixelRatio(devicePixelRatio);
r.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a2220);
scene.add(new THREE.HemisphereLight(0xffe6c8, 0x2a2018, 1.6));
const sun = new THREE.DirectionalLight(0xffd0a0, 2.2);
sun.position.set(-2, 3, 3);
scene.add(sun);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x1c1816, roughness: 0.6 }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);
const t = parseFloat(q.get("t") ?? "0");
const specs = [["a", -0.9], ["b", 0.9]].filter(([k]) => q.get(k));
const loader = new GLTFLoader().setMeshoptDecoder(MeshoptDecoder);
for (const [k, x] of specs) {
  const g = await loader.loadAsync(q.get(k));
  const obj = g.scene;
  obj.position.x = specs.length === 1 ? 0 : x;
  scene.add(obj);
  const name = q.get("clip" + k);
  const clip = g.animations.find((a) => a.name === name) ?? g.animations[0];
  const mixer = new THREE.AnimationMixer(obj);
  mixer.clipAction(clip).play();
  mixer.setTime(t * (clip.duration || 1) * (q.get("frac") ? 1 : 0) + (q.get("frac") ? 0 : t));
  scene.updateMatrixWorld(true);
  obj.traverse((o) => { if (o.isSkinnedMesh) { o.skeleton.update(); o.frustumCulled = false; } });
  window["__clip_" + k] = clip.name + " " + clip.duration.toFixed(2);
}
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.1, 50);
const view = q.get("view") ?? "front";
const d = specs.length === 1 ? 4.8 : 6.2;
const pos = { front: [0, 1.15, d], q34: [d * 0.6, 1.3, d * 0.8], side: [d, 1.1, 0.01], back: [0, 1.2, -d] }[view];
cam.position.set(...pos);
cam.lookAt(0, 0.95, 0);
r.render(scene, cam);
window.__ready = true;
</script>
