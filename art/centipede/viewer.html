<!doctype html><meta name="viewport" content="width=device-width">
<style>html,body{margin:0;background:#1a1512}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script>
<script type="module">
import * as THREE from "three";
import { GLTFLoader } from "three/addons/loaders/GLTFLoader.js";
import { MeshoptDecoder } from "three/addons/libs/meshopt_decoder.module.js";
// ?glb=/file.glb &view=q34|front|top|side &clip=roach_walk &t=0.3 (seconds into the clip) &scale=3
const q = new URLSearchParams(location.search);
const view = q.get("view") ?? "q34";
const r = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
r.setSize(innerWidth, innerHeight);
r.setPixelRatio(devicePixelRatio);
r.outputColorSpace = THREE.SRGBColorSpace;
r.toneMapping = THREE.ACESFilmicToneMapping;
document.body.appendChild(r.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a2220);
scene.fog = new THREE.Fog(0x2a2220, 8, 30);
scene.add(new THREE.HemisphereLight(0xffd9a8, 0x2a2018, 1.1));
const sun = new THREE.DirectionalLight(0xffc890, 2.4);
sun.position.set(-2, 3, 2.5);
scene.add(sun);
const rim = new THREE.DirectionalLight(0x8899aa, 0.9);
rim.position.set(2, 1.5, -3);
scene.add(rim);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshStandardMaterial({ color: 0x1c1816, roughness: 0.35, metalness: 0.1 }));
ground.rotation.x = -Math.PI / 2;
scene.add(ground);
const cam = new THREE.PerspectiveCamera(32, innerWidth / innerHeight, 0.1, 50);
const g = await new GLTFLoader().setMeshoptDecoder(MeshoptDecoder).loadAsync(q.get("glb"));
const m = g.scene;
m.scale.setScalar(Number(q.get("scale") ?? 3));
scene.add(m);
const mixer = new THREE.AnimationMixer(m);
const clip = g.animations.find((a) => a.name === (q.get("clip") ?? "roach_idle"));
const act = mixer.clipAction(clip);
act.play();
mixer.update(Number(q.get("t") ?? 0.2));
m.updateMatrixWorld(true);
const box = new THREE.Box3().setFromObject(m);
const c = box.getCenter(new THREE.Vector3());
const views = { q34: [2.6, 2.4, 3.4], front: [0, 1.3, 5.2], top: [0.01, 6.5, 0.3], side: [4.8, 1.3, 0] };
const p = views[view];
cam.position.set(c.x + p[0], c.y + p[1], c.z + p[2]);
cam.lookAt(c);
r.render(scene, cam);
// the pincer tip vertex of each side (most forward vertex dominated by that mandible bone), for manifest contact.canines
const tips = {};
m.traverse((o) => {
  if (!o.isSkinnedMesh) return;
  const p = o.geometry.attributes.position, si = o.geometry.attributes.skinIndex, sw = o.geometry.attributes.skinWeight;
  const names = o.skeleton.bones.map((b) => b.name);
  for (let i = 0; i < p.count; i++) {
    let best = 0, bw = -1;
    for (let k = 0; k < 4; k++) if (sw.getComponent(i, k) > bw) { bw = sw.getComponent(i, k); best = si.getComponent(i, k); }
    const n = names[best];
    if (n !== "mandible_L" && n !== "mandible_R") continue;
    if (!tips[n] || p.getZ(i) > tips[n].z) tips[n] = { i, z: p.getZ(i), x: p.getX(i), y: p.getY(i), mesh: o.name, verts: p.count };
  }
});
window.__tips = tips;
window.__ready = true;
window.__info = { box: box.min.toArray().concat(box.max.toArray()), clips: g.animations.map((a) => [a.name, a.duration]) };
</script>
