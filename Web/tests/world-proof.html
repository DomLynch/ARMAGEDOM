<!doctype html><meta charset="utf-8"><title>World calibration probe</title>
<style>body{margin:0;background:#000}canvas{display:block;width:100vw;height:100vh}aside{position:fixed;top:0;left:0;color:#fff;background:#0009;font:12px sans-serif;padding:8px}</style>
<aside>WORLD CALIBRATION PROBE • WASD • geometry/depth verification, not character art</aside>
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js"}}</script>
<script type="module">
import * as THREE from 'three';
import {createWorld} from '../src/world.js';
const renderer=new THREE.WebGLRenderer({antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(1);renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.append(renderer.domElement);
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera();
const world=await createWorld({THREE,renderer,scene,camera,baseUrl:new URL('/public/',location.href)});
const probe=new THREE.Mesh(new THREE.CapsuleGeometry(.35,1.3,4,8),new THREE.MeshBasicMaterial({color:0x00ffff}));scene.add(probe);
let position={...world.spawn},last=performance.now();const keys=new Set();
addEventListener('keydown',e=>keys.add(e.key.toLowerCase()));addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>keys.clear());
function draw(immediate=false){renderer.setSize(innerWidth,innerHeight,false);world.update(position,1/60,innerWidth,innerHeight,immediate);probe.position.copy(world.toRender(position,1));renderer.render(scene,camera);}
function pixels(){const context=renderer.getContext(),data=new Uint8Array(innerWidth*innerHeight*4);context.readPixels(0,0,innerWidth,innerHeight,context.RGBA,context.UNSIGNED_BYTE,data);let cyan=0;for(let i=0;i<data.length;i+=4)if(data[i]<30&&data[i+1]>220&&data[i+2]>220)cyan++;return cyan;}
window.proof={world,scene,camera,renderer,probe,get position(){return position;},setPosition(p){position={...p};draw(true);},draw,pixels};
function loop(now){const dt=Math.min((now-last)/1000,.05);last=now;const x=Number(keys.has('d'))-Number(keys.has('a')),z=Number(keys.has('w'))-Number(keys.has('s')),length=Math.hypot(x,z)||1;position=world.move(position,{x:x/length*5*dt,z:z/length*5*dt},.4);draw();requestAnimationFrame(loop);}
draw(true);window.PROOF_READY=true;requestAnimationFrame(loop);
</script>
